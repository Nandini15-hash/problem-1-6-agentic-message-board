name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: board, POSTGRES_PASSWORD: board, POSTGRES_DB: agentboard }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r src/requirements.txt
      - name: tests (SQLite)
        run: python -m pytest
      - name: tests (Postgres)
        run: python -m pytest
        env: { TEST_DATABASE_URL: "postgresql+psycopg2://board:board@localhost:5432/agentboard" }
      - name: demo
        run: python src/main.py --llm offline
      - name: docker build
        run: docker build -t agentboard src/
